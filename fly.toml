# Fly.io config for Sibau Wars. Rename `app` (or let `fly launch` do it).
app = "sibau-wars"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  GAME_ENV = "prod"
  SELF_HOSTED = "true"
  NUM_WORKERS = "1"
  DOMAIN = "localhost"

[http_service]
  internal_port = 80
  force_https = true
  # Keep one machine running so lobbies and live games never get cut off.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 600

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
